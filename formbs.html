<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGP Student portal</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container my-5">
        
        <!-- Header Section -->
        <header class="text-center mb-4">
            <h1 class="text-warning display-5 fw-bold">STUDENT PORTAL</h1>
            <hr class="w-70 mx-auto">
        </header>

        <!-- Main Form Card -->
        <div class="card shadow-sm mb-5">
            <div class="card-body p-4">
                <h2 class="text-warning mb-4">Student Registration Form</h2>
                
                <form action="/register" method="POST">
                    <!-- Name Field -->
                    <div class="mb-3">
                        <label for="studentName" class="form-label">Student Name</label>
                        <input type="text" class="form-control" name="studentName" placeholder="Enter name: ">
                    </div>

                    <!-- Email Field -->
                    <div class="mb-3">
                        <label for="studentEmail" class="form-label">Email</label>
                        <input type="email" class="form-control" name="studentEmail" placeholder="Enter email: ">
                    </div>

                    <!-- Phone Number Field -->
                    <div class="mb-3">
                        <label for="studentPhone" class="form-label">Phone number</label>
                        <input type="text" class="form-control" name="studentPhone">
                    </div>

                    <!-- Department Select Dropdown -->
                    <div class="mb-3">
                        <label for="departmentSelect" class="form-label">Department</label>
                        <select class="form-select" name="departmentSelect">
                            <option>CSE</option>
                            <option>ECE</option>
                            <option>CSBS</option>
                        </select>
                    </div>

                    <!-- Gender Radio Buttons -->
                    <div class="mb-3">
                        <label class="form-label d-block">Gender</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
                            <label class="form-check-label" for="male" >Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
                            <label class="form-check-label" for="female">Female</label>
                        </div>
                    </div>

                    <!-- Skills Checkboxes -->
                    <div class="mb-4">
                        <label class="form-label d-block">Skills</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="skills" id="skillC" value="C">
                            <label class="form-check-label" for="skillC">C</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="skills" id="skillPython" value="Python">
                            <label class="form-check-label" for="skillPython">Python</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="skills" id="skillSQL" value="SQL">
                            <label class="form-check-label" for="skillSQL">SQL</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="skills" id="skillHTML" value="HTML">
                            <label class="form-check-label" for="skillHTML">HTML</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="skills" id="skillCSS" value="CSS" >
                            <label class="form-check-label" for="skillCSS">CSS</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="skills" id="skillJava" value="JAVA">
                            <label class="form-check-label" for="skillJava">Java</label>
                        </div>
                    </div>

                    <!-- Form Action Buttons -->
                    <div>
                        <button type="submit" class="btn btn-primary me-2">Register</button>
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Student Details Table Section -->
        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <h2 class="text-dark mb-3">Student Details</h2>
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Department</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>1001</td>
                                <td>Sri Vidhya</td>
                                <td>srividhya@mail.com</td>
                                <td>CSBS</td>
                            </tr>
                            <tr>
                                <td>1002</td>
                                <td>Minal</td>
                                <td>minal@mail.com</td>
                                <td>-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-5 pt-3 text-center border-top text-muted">
            <p>&copy; 2026 NGP Student Portal. All rights reserved.</p>
        </footer>

    </div>

    <!-- Optional Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
